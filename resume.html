<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zach's Resume</title>
  <meta name="description" content="Resume of Zach Prynne, computer science student." />
  <link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Each rendered page. The JS sets width:100% so pages scale with the column;
       height:auto preserves aspect ratio. */
    .pdf-page {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 0 16px;
      background: #fff;
      border: 3px ridge var(--chrome);
    }
  </style>
</head>
<body>
  <div class="frame">
    <header class="banner">
      <h1>
        <a href="index.html">
          <picture>
            <source srcset="assets/title.png" media="(prefers-reduced-motion: reduce)" />
            <img src="assets/title.gif" alt="Zach's Home Page" width="458" height="54" />
          </picture>
        </a>
      </h1>
      <p class="tagline">The personal web site of Zach Prynne, computer science student</p>
    </header>

    <main>
      <h2>Resume</h2>
      <nav aria-label="Resume">
        <p>
          [ <a href="index.html">Home</a>
          | <a href="resume.pdf">PDF</a>
          | <a href="https://github.com/zprynne/zprynne.github.io/blob/main/resume-src/main.tex">LaTeX source</a> ]
        </p>
      </nav>

      <!-- PDF.js renders the PDF onto <canvas> elements. Native browser embedding
           (<iframe>/<object>) is unreliable — Safari refuses to show PDFs inline —
           so we rasterize each page ourselves. This works in every browser. -->
      <div id="pdf-container" aria-label="Resume preview">
        <noscript><p>The preview needs JavaScript. The PDF link above works without it.</p></noscript>
      </div>
    </main>

    <footer class="footer">
      <hr class="bits" />
      <p>
        <img src="assets/email.gif" alt="" width="32" height="25" class="envelope" />
        <a href="mailto:zachvprynne@outlook.com">Email me!</a>
      </p>
    </footer>
  </div>

  <script src="fx.js" defer></script>

  <!-- PDF.js loaded as an ES module from a pinned CDN version.
       It fetches resume.pdf, then draws each page to a <canvas>, scaled to the
       container width and the device pixel ratio so it stays crisp on retina. -->
  <script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs";

    const container = document.getElementById("pdf-container");
    const status = document.createElement("p");
    status.textContent = "Loading preview…";
    container.appendChild(status);

    async function renderResume() {
      try {
        const pdf = await pdfjsLib.getDocument("resume.pdf").promise;
        status.remove(); // drop the "Loading…" message once we have the doc

        // devicePixelRatio: render at the screen's true pixel density so text
        // isn't blurry on high-DPI ("retina") displays.
        const dpr = window.devicePixelRatio || 1;

        for (let n = 1; n <= pdf.numPages; n++) {
          const page = await pdf.getPage(n);
          const unscaled = page.getViewport({ scale: 1 });
          // Fit the page to the container's CSS width.
          const cssScale = container.clientWidth / unscaled.width;
          const viewport = page.getViewport({ scale: cssScale * dpr });

          const canvas = document.createElement("canvas");
          canvas.className = "pdf-page";
          canvas.width = viewport.width;            // backing-store pixels
          canvas.height = viewport.height;
          canvas.style.width = "100%";              // displayed (CSS) size
          canvas.style.height = "auto";
          container.appendChild(canvas);

          await page.render({
            canvasContext: canvas.getContext("2d"),
            viewport,
          }).promise;
        }
      } catch (err) {
        // Network blocked, CDN down, etc. — point to the plain PDF instead.
        status.innerHTML =
          'The preview didn’t load. Open the <a href="resume.pdf">PDF</a> instead.';
        console.error("PDF.js render failed:", err);
      }
    }

    renderResume();
  </script>
</body>
</html>
